schema_version = "code_analysis_policy_v4"

[boundaries]
# Application convention: package owners ending in this suffix are custom.
# This rule applies to PL/SQL program units, never to tables or views.
custom_program_unit_suffixes = ["_CUSTOM", "_MAIN"]
infer_noncustom_qualified_packages_as_kernel = false
kernel_package_names = []
kernel_package_prefixes = []
external_package_prefixes = ["DBMS_", "UTL_"]
infrastructure_utility_calls = [
  "DEBUG.PR_DEBUG",
  "GLOBAL.PR_INIT",
  "ISDEBUG.WRITELINE",
  "PKGGLOBAL.PR_INIT",
  "PR_DEBUG"
]
ignored_builtin_calls = [
  "ABS", "AVG", "CAST", "COALESCE", "COUNT", "DECODE", "GREATEST",
  "LEAST", "LOWER", "MAX", "MIN", "NVL", "NVL2", "ROUND", "SUBSTR",
  "SUM", "TO_CHAR", "TO_DATE", "TO_NUMBER", "TRIM", "UPPER"
]
